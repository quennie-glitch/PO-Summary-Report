<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO Summary — In-Transit, Booked & Quoted</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;font-size:14px}
  header{background:#1a1a18;color:#f5f4f0;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:600;letter-spacing:-.3px}
  header span{font-size:12px;opacity:.6}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:1.5rem 2rem 0}
  .kpi{background:#fff;border:0.5px solid #e0dfd8;border-radius:10px;padding:1rem 1.125rem}
  .kpi-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .kpi-val{font-size:24px;font-weight:600;color:#1a1a18;line-height:1}
  .kpi-sub{font-size:11px;color:#aaa;margin-top:4px}
  .controls{display:flex;gap:10px;padding:1.25rem 2rem;flex-wrap:wrap;align-items:center}
  .controls select,.controls input[type=text]{padding:7px 12px;border:0.5px solid #d0cfc8;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;outline:none}
  .controls input[type=text]{flex:1;min-width:200px}
  .controls select:focus,.controls input:focus{border-color:#888}
  .table-wrap{margin:0 2rem 2rem;border:0.5px solid #e0dfd8;border-radius:12px;overflow:hidden;background:#fff}
  .tbl-header{padding:.75rem 1.25rem;background:#f9f8f4;border-bottom:0.5px solid #e0dfd8;display:flex;justify-content:space-between;align-items:center}
  .tbl-header span{font-size:12px;color:#888}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;border-bottom:0.5px solid #e0dfd8;background:#f9f8f4;white-space:nowrap;position:sticky;top:0;z-index:1}
  td{padding:9px 12px;border-bottom:0.5px solid #f0efe8;color:#1a1a18;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#faf9f6}
  .po{font-weight:600;font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
  .b-transit{background:#e1f5ee;color:#085041}
  .b-prod{background:#faeeda;color:#633806}
  .b-booked{background:#e6f1fb;color:#0c447c}
  .b-ready{background:#eaf3de;color:#27500a}
  .b-dev{background:#f1efe8;color:#444441}
  .b-delivered{background:#eeedfe;color:#3c3489}
  .b-sea{background:#e6f1fb;color:#185fa5}
  .b-air{background:#eeedfe;color:#534ab7}
  .b-tbd{background:#f1efe8;color:#5f5e5a}
  .b-approved{background:#eaf3de;color:#27500a}
  .b-review{background:#faeeda;color:#633806}
  .b-submitted{background:#e6f1fb;color:#0c447c}
  .b-intransit-tops{background:#e1f5ee;color:#085041}
  .note{font-size:11.5px;color:#666;line-height:1.45;max-height:44px;overflow:hidden;cursor:pointer;transition:max-height .2s}
  .note.expanded{max-height:200px}
  .note::after{content:" ▾";color:#bbb;font-size:10px}
  .note.expanded::after{content:" ▴"}
  .eta-soon{color:#3b6d11;font-weight:600}
  .eta-overdue{color:#a32d2d;font-weight:600}
  .col-po{width:100px}
  .col-sup{width:52px}
  .col-type{width:110px}
  .col-qty{width:70px;text-align:right!important}
  .col-mode{width:70px}
  .col-exf{width:88px}
  .col-eta{width:88px}
  .col-status{width:110px}
  .col-tops{width:110px}
  .col-note{width:auto}
  .empty{text-align:center;padding:3rem;color:#aaa;font-size:13px}
  .scroll-wrap{max-height:70vh;overflow-y:auto}
  @media(max-width:900px){
    .controls,.kpis,header,.table-wrap{padding-left:1rem;padding-right:1rem}
    .table-wrap{margin:0 1rem 1.5rem;overflow-x:auto}
    table{min-width:900px}
  }
</style>
</head>

<header>

    </table>
  </div>
</div>

  {po:"TH3533",sup:"TH",type:"Blazers",qty:375,mode:"TBD",exf:"6/25/2026",eta:"7/31/2026",status:"Development Ongoing",tops:"",note:"In Development — ETA to Warehouse: 7/31/2026"},
  {po:"TH3501",sup:"TH",type:"Classic Fit",qty:257,mode:"AIR",exf:"5/20/2026",eta:"8/1/2026",status:"",tops:"",note:"Departed — ETA to Warehouse: 8/1/2026"},
];

function parseD(s){if(!s)return null;const p=s.split("/");return new Date(+p[2],+p[0]-1,+p[1]);}
const TODAY=new Date(2026,4,29);

function statusBadge(s){
  const m={"In-Transit":"b-transit","In Production":"b-prod","Booked":"b-booked","Ready to Ship":"b-ready","Development Ongoing":"b-dev","Delivered":"b-delivered"};
  if(!s)return"<span style='color:#bbb'>—</span>";
  return`<span class="badge ${m[s]||'b-dev'}">${s}</span>`;
}
function modeBadge(m){
  if(m==="SEA")return`<span class="badge b-sea">&#9875; SEA</span>`;
  if(m==="AIR")return`<span class="badge b-air">&#9992; AIR</span>`;
  return`<span class="badge b-tbd">TBD</span>`;
}
function etaCell(s){
  const d=parseD(s);if(!d)return"—";
  const diff=Math.round((d-TODAY)/86400000);
  let cls="";
  if(diff<=7&&diff>=0)cls="eta-soon";
  else if(diff<0)cls="eta-overdue";
  return`<span class="${cls}">${s}</span>`;
}
function topsBadge(t){
  if(!t)return"<span style='color:#bbb'>—</span>";
  const m={"Approved":"b-approved","Under Review":"b-review","Requested/Submitted":"b-submitted","In-Transit":"b-intransit-tops"};
  return`<span class="badge ${m[t]||'b-dev'}">${t}</span>`;
}

function buildFilters(){
  const opts=(id,arr)=>{const el=document.getElementById(id);arr.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o);});};
  opts("filterStatus",[...new Set(DATA.map(r=>r.status).filter(Boolean))].sort());
  opts("filterMode",[...new Set(DATA.map(r=>r.mode).filter(Boolean))].sort());
  opts("filterSupplier",[...new Set(DATA.map(r=>r.sup).filter(Boolean))].sort());
}

function render(){
  const fS=document.getElementById("filterStatus").value;
  const fM=document.getElementById("filterMode").value;
  const fSup=document.getElementById("filterSupplier").value;
  const q=document.getElementById("search").value.toLowerCase().trim();

  const rows=DATA.filter(r=>{
    if(fS&&r.status!==fS)return false;
    if(fM&&r.mode!==fM)return false;
    if(fSup&&r.sup!==fSup)return false;
    if(q&&![r.po,r.sup,r.type,r.note].join(" ").toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>{
    const da=parseD(a.eta),db=parseD(b.eta);
    if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;
    return da-db;
  });

  const total=rows.reduce((s,r)=>s+(r.qty||0),0);
  const inTransit=rows.filter(r=>r.status==="In-Transit").length;
  const arriving=rows.filter(r=>{const d=parseD(r.eta);return d&&Math.round((d-TODAY)/86400000)<=14&&Math.round((d-TODAY)/86400000)>=0&&r.status!=="Delivered";}).length;
  const needMode=rows.filter(r=>r.mode==="TBD").length;

  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="kpi-label">POs shown</div><div class="kpi-val">${rows.length}</div><div class="kpi-sub">of ${DATA.length} total</div></div>
    <div class="kpi"><div class="kpi-label">Total units</div><div class="kpi-val">${total.toLocaleString()}</div></div>
    <div class="kpi"><div class="kpi-label">In transit</div><div class="kpi-val">${inTransit}</div><div class="kpi-sub">active shipments</div></div>
    <div class="kpi"><div class="kpi-label">Arriving ≤14 days</div><div class="kpi-val">${arriving}</div><div class="kpi-sub">upcoming ETAs</div></div>
    <div class="kpi"><div class="kpi-label">Need ship mode</div><div class="kpi-val">${needMode}</div><div class="kpi-sub">TBD mode</div></div>
  `;

  document.getElementById("countLabel").textContent=`${rows.length} purchase order${rows.length!==1?"s":""}`;

  const tbody=document.getElementById("tbody");
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="10" class="empty">No matching records</td></tr>`;return;}
  tbody.innerHTML=rows.map(r=>`<tr>
    <td class="po col-po">${r.po}</td>
    <td class="col-sup">${r.sup}</td>
    <td class="col-type" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${r.type}</td>
    <td class="col-qty" style="text-align:right">${(r.qty||0).toLocaleString()}</td>
    <td class="col-mode">${modeBadge(r.mode)}</td>
    <td class="col-exf" style="font-size:12px">${r.exf||"—"}</td>
    <td class="col-eta" style="font-size:12px">${etaCell(r.eta)}</td>
    <td class="col-status">${statusBadge(r.status)}</td>
    <td class="col-tops">${topsBadge(r.tops)}</td>
    <td class="col-note"><div class="note" onclick="this.classList.toggle('expanded')">${r.note||"—"}</div></td>
  </tr>`).join("");
}

buildFilters();
render();
["filterStatus","filterMode","filterSupplier"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.getElementById("search").addEventListener("input",render);
document.getElementById("ts").textContent="Last synced: May 29, 2026";
</script>
</body>
</html>
